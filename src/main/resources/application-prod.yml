# =====================================================================
# LEARNING-MANAGEMENT-SERVICE — PRODUCTION
# =====================================================================

server:
  port: ${PORT:8084}
  shutdown: graceful
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: learning-management-service

  output:
    ansi:
      enabled: NEVER

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:learning_management}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAPSERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:learning-management-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ${KAFKA_TRUSTED_PACKAGES:*}
        session.timeout.ms: 60000
        heartbeat.interval.ms: 20000
        max.poll.interval.ms: 300000
        max.poll.records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        retry.backoff.ms: 1000
        max.in.flight.requests.per.connection: 1
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      request.timeout.ms: 30000
      connections.max.idle.ms: 540000
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 10000

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_DEFAULT_CONNECT_TIMEOUT:5000}
            readTimeout: ${FEIGN_DEFAULT_READ_TIMEOUT:5000}
            loggerLevel: ${FEIGN_LOG_LEVEL:BASIC}
          video-service:
            connectTimeout: ${FEIGN_VIDEO_CONNECT_TIMEOUT:10000}
            readTimeout: ${FEIGN_VIDEO_READ_TIMEOUT:10000}
            loggerLevel: ${FEIGN_LOG_LEVEL:BASIC}
          user-service:
            connectTimeout: ${FEIGN_USER_CONNECT_TIMEOUT:10000}
            readTimeout: ${FEIGN_USER_READ_TIMEOUT:10000}
            loggerLevel: ${FEIGN_LOG_LEVEL:BASIC}

kafka:
  topics:
    booking-events: ${KAFKA_TOPIC_BOOKING_EVENTS:booking-events}
    session-events: ${KAFKA_TOPIC_SESSION_EVENTS:session-events}

video:
  service:
    url: ${VIDEO_SERVICE_URL}

user:
  service:
    url: ${USER_SERVICE_URL}

auth:
  service:
    url: ${AUTH_SERVICE_URL}

feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      video-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 15s
        failureRateThreshold: 50
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 50
        eventConsumerBufferSize: 10

      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

  timelimiter:
    instances:
      video-service:
        timeoutDuration: 15s
      user-service:
        timeoutDuration: 10s

# Cloud Run production: use direct service URLs, not Eureka discovery
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    mongo:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.tcon.learning_management_service: ${LOG_LEVEL_APP:INFO}
    org.springframework.data.mongodb.core.MongoTemplate: WARN
    org.springframework.cloud.loadbalancer: WARN
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    io.github.resilience4j: INFO
    com.netflix.discovery: WARN
    reactor.netty: WARN
    io.netty: ERROR
    feign: ${LOG_LEVEL_FEIGN:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"